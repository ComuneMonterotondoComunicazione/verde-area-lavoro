<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Area di lavoro · Verde pubblico Monterotondo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icona-192.png">
<link rel="apple-touch-icon" href="icona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verde">
<meta name="theme-color" content="#0f3d2e">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Titillium+Web:wght@400;600;700&display=swap">
<style>
  :root {
    --bosco: #0f3d2e; --bosco-2: #17533f; --foglia: #2f8f5b; --germoglio: #a7d38a; --salvia: #dfeadc; --crema: #f6f3ea;
    --carta: #fffdf8; --inchiostro: #17251f; --muschio: #5b6b63; --linea: #e4e0d3; --ambra: #e0a43a;
    --rosso: #c8372d; --rosso-bg: #fdecea; --arancio: #d9761e; --arancio-bg: #fff1e0; --blu: #2a6fb5; --blu-bg: #e8f1fb; --verde-bg: #e7f4ea;
    --ombra: 0 1px 2px rgba(15,61,46,.06), 0 8px 24px rgba(15,61,46,.10);
    --serif: "Fraunces", Georgia, serif; --sans: "Titillium Web", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--sans); color: var(--inchiostro); background: var(--crema); display: grid; grid-template-rows: auto 1fr; font-size: 15.5px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* Testata */
  .testata { background: var(--carta); border-bottom: 1px solid var(--linea); display: flex; align-items: center; gap: 16px; padding: 8px 18px; }
  .testata img { height: 42px; }
  .testata .titolo { border-left: 1px solid var(--linea); padding-left: 16px; }
  .testata .k { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--foglia); font-weight: 700; }
  .testata h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 1.35rem; color: var(--bosco); line-height: 1.1; }
  .testata .spazio { flex: 1; }
  .interno { background: #fff4dc; color: #8a5a00; border: 1px solid #f1d49a; border-radius: 999px; font-size: .72rem; font-weight: 700; padding: 4px 10px; text-transform: uppercase; letter-spacing: .05em; }
  .salvataggio { font-size: .85rem; color: var(--muschio); display: flex; align-items: center; gap: 6px; }
  .salvataggio i { width: 8px; height: 8px; border-radius: 50%; background: var(--foglia); display: inline-block; }
  .salvataggio.avviso i { background: var(--ambra); }

  /* Layout */
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
  .menu { background: var(--bosco); color: #fff; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .menu button { display: flex; align-items: center; gap: 12px; border: 0; background: none; color: rgba(255,255,255,.82); padding: 10px 12px; border-radius: 10px; text-align: left; font-weight: 600; font-size: .98rem; }
  .menu button svg { width: 20px; height: 20px; flex: none; }
  .menu button:hover { background: rgba(255,255,255,.08); color: #fff; }
  .menu button.attivo { background: var(--germoglio); color: var(--bosco); }
  .menu button .cnt { margin-left: auto; background: var(--rosso); color: #fff; border-radius: 999px; font-size: .74rem; padding: 1px 7px; font-weight: 700; }
  .menu .sep { height: 1px; background: rgba(255,255,255,.12); margin: 10px 6px; }
  .menu .piccolo { font-size: .78rem; color: rgba(255,255,255,.55); padding: 4px 12px; line-height: 1.4; margin-top: auto; }
  .contenuto { overflow-y: auto; min-height: 0; position: relative; }
  .pagina { padding: 24px 28px 60px; max-width: 1400px; }
  .pagina h2 { font-family: var(--serif); font-weight: 600; font-size: 1.7rem; color: var(--bosco); margin: 0 0 4px; }
  .pagina .sotto { color: var(--muschio); margin: 0 0 20px; }

  /* Componenti */
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi button { text-align: left; background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 14px 16px; transition: box-shadow .15s, border-color .15s; }
  .kpi button:hover { border-color: var(--foglia); box-shadow: var(--ombra); }
  .kpi b { display: block; font-family: var(--serif); font-size: 2rem; line-height: 1; color: var(--bosco); }
  .kpi span { display: block; color: var(--muschio); font-size: .9rem; margin-top: 6px; line-height: 1.25; }
  .kpi .rosso b { color: var(--rosso); } .kpi .arancio b { color: var(--arancio); }
  .colonne { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .colonna { background: #fff; border: 1px solid var(--linea); border-radius: 16px; display: flex; flex-direction: column; min-height: 0; max-height: 560px; }
  .colonna header { padding: 12px 16px; border-bottom: 1px solid var(--linea); display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .colonna header .pill { margin-left: auto; }
  .colonna .lista { overflow-y: auto; padding: 6px; }
  .colonna.ritardo header { color: var(--rosso); } .colonna.settimana header { color: var(--arancio); } .colonna.mese header { color: var(--blu); }
  .voce { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: start; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 10px; }
  .voce:hover { background: var(--crema); }
  .voce .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; grid-row: span 2; }
  .voce .ic svg { width: 17px; height: 17px; }
  .voce b { font-size: .95rem; line-height: 1.2; }
  .voce small { color: var(--muschio); font-size: .82rem; grid-column: 2 / 4; line-height: 1.25; }
  .voce .q { font-size: .8rem; color: var(--muschio); white-space: nowrap; }
  .vuoto { color: var(--muschio); padding: 18px; text-align: center; font-size: .92rem; }
  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: .76rem; font-weight: 700; white-space: nowrap; background: var(--crema); color: var(--muschio); }
  .p-alta { background: var(--rosso-bg); color: var(--rosso); } .p-media { background: var(--arancio-bg); color: var(--arancio); } .p-bassa { background: var(--verde-bg); color: var(--foglia); }
  .s-da { background: #eceae3; color: #5b5b52; } .s-prog { background: var(--blu-bg); color: var(--blu); } .s-corso { background: var(--arancio-bg); color: var(--arancio); } .s-fatto { background: var(--verde-bg); color: var(--foglia); } .s-annullato { background: #eee; color: #888; text-decoration: line-through; }
  .avvisi { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .avviso { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; text-align: left; background: #fff; border: 1px solid var(--linea); border-left: 4px solid var(--ambra); border-radius: 12px; padding: 12px 14px; }
  .avviso.alto { border-left-color: var(--rosso); } .avviso.info { border-left-color: var(--blu); } .avviso.stagione { border-left-color: var(--foglia); }
  .avviso .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--crema); display: grid; place-items: center; }
  .avviso .ic svg { width: 20px; height: 20px; }
  .avviso b { display: block; line-height: 1.2; } .avviso small { color: var(--muschio); line-height: 1.3; display: block; margin-top: 2px; }
  .avviso .n { font-family: var(--serif); font-size: 1.5rem; color: var(--bosco); }
  .avviso:hover { box-shadow: var(--ombra); }
  .sezione-t { font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muschio); font-weight: 700; margin: 22px 0 10px; }

  .filtri { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .filtri input[type=search], .filtri select { border: 1.5px solid var(--linea); background: #fff; border-radius: 10px; padding: 8px 12px; min-width: 0; }
  .filtri input[type=search] { flex: 1 1 240px; }
  .schede-stato { display: flex; gap: 4px; background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 4px; flex-wrap: wrap; }
  .schede-stato button { border: 0; background: none; border-radius: 9px; padding: 6px 12px; font-weight: 700; color: var(--muschio); font-size: .9rem; }
  .schede-stato button.attivo { background: var(--bosco); color: #fff; }
  .schede-stato button span { opacity: .7; font-weight: 600; margin-left: 4px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
  th { text-align: left; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muschio); background: var(--crema); padding: 10px 12px; font-weight: 700; position: sticky; top: 0; }
  td { padding: 10px 12px; border-top: 1px solid var(--linea); vertical-align: top; font-size: .93rem; }
  tr.cliccabile { cursor: pointer; } tr.cliccabile:hover td { background: #fbfaf5; }
  td .sub { color: var(--muschio); font-size: .82rem; display: block; }
  .altri { display: block; margin: 12px auto 0; border: 1.5px solid var(--linea); background: #fff; border-radius: 10px; padding: 8px 18px; font-weight: 700; color: var(--bosco); }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--linea); background: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 700; color: var(--bosco); font-size: .92rem; }
  .btn:hover { border-color: var(--foglia); }
  .btn.pieno { background: var(--bosco); border-color: var(--bosco); color: #fff; }
  .btn.pieno:hover { background: var(--foglia); }
  .btn.rosso { color: var(--rosso); }
  .btn svg { width: 16px; height: 16px; }

  /* Storico */
  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 17px; top: 4px; bottom: 4px; width: 2px; background: var(--linea); }
  .timeline li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 8px 0; position: relative; }
  .timeline .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--crema); position: relative; z-index: 1; }
  .timeline .ic svg { width: 16px; height: 16px; }
  .timeline .riga { background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 10px 14px; }
  .timeline .riga header { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .timeline .riga b { font-size: .97rem; }
  .timeline .riga time { color: var(--muschio); font-size: .84rem; margin-left: auto; }
  .timeline .riga p { margin: 4px 0 0; color: var(--muschio); font-size: .92rem; line-height: 1.4; }
  .timeline .riga .chi { font-size: .78rem; color: var(--muschio); margin-top: 4px; }
  .timeline .riga button.albero { border: 0; background: none; padding: 0; color: var(--foglia); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .mese-t { font-family: var(--serif); color: var(--bosco); font-size: 1.15rem; margin: 18px 0 6px 48px; }

  /* Mappa */
  #mappaLavoro { position: absolute; inset: 0; }
  .leg-mappa { position: absolute; left: 14px; bottom: 24px; z-index: 900; background: #fff; border-radius: 12px; box-shadow: var(--ombra); padding: 10px 14px; font-size: .88rem; display: grid; gap: 4px; }
  .leg-mappa span { display: flex; align-items: center; gap: 8px; }
  .leg-mappa i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .tt { background: var(--bosco) !important; color: #fff !important; border: 0 !important; border-radius: 8px !important; font-family: var(--sans); }
  .tt::before { display: none; }

  /* Scheda albero (cassetto) */
  .cassetto { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--carta); z-index: 2000; box-shadow: -10px 0 40px rgba(15,61,46,.2);
    transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
  .cassetto.aperto { transform: none; }
  .velo { position: fixed; inset: 0; background: rgba(15,61,46,.25); z-index: 1999; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .velo.aperto { opacity: 1; pointer-events: auto; }
  .cassetto .testa { padding: 18px 22px 14px; border-bottom: 1px solid var(--linea); background: linear-gradient(180deg, var(--salvia), var(--carta)); position: relative; }
  .cassetto .chiudi { position: absolute; right: 14px; top: 14px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: #fff; box-shadow: var(--ombra); display: grid; place-items: center; }
  .cassetto .k { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muschio); font-weight: 700; }
  .cassetto h3 { font-family: var(--serif); font-weight: 600; font-size: 1.6rem; margin: 2px 40px 0 0; color: var(--bosco); line-height: 1.1; }
  .cassetto .bot { font-style: italic; color: var(--muschio); }
  .cassetto .corpo { overflow-y: auto; padding: 16px 22px 30px; flex: 1; }
  .cassetto .azioni { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .griglia-dati { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--linea); border: 1px solid var(--linea); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .griglia-dati div { background: #fff; padding: 8px 12px; }
  .griglia-dati dt { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muschio); font-weight: 700; }
  .griglia-dati dd { margin: 2px 0 0; font-weight: 600; }
  .griglia-dati .largo { grid-column: span 3; }
  .cpc { display: inline-grid; place-items: center; min-width: 30px; height: 26px; padding: 0 7px; border-radius: 7px; color: #fff; font-weight: 700; font-size: .85rem; }
  .ordine-mini { border: 1px solid var(--linea); background: #fff; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; cursor: pointer; }
  .ordine-mini:hover { border-color: var(--foglia); }
  .ordine-mini small { color: var(--muschio); grid-column: 1 / 3; }

  /* Finestre modulo */
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(560px, calc(100% - 24px)); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(15,61,46,.4); }
  dialog form { padding: 22px 24px; display: grid; gap: 12px; }
  dialog h3 { font-family: var(--serif); font-weight: 600; color: var(--bosco); margin: 0; font-size: 1.4rem; }
  dialog .sotto { color: var(--muschio); margin: -6px 0 4px; font-size: .92rem; }
  dialog label { display: grid; gap: 4px; font-weight: 700; font-size: .86rem; color: var(--muschio); }
  dialog input, dialog select, dialog textarea { border: 1.5px solid var(--linea); border-radius: 10px; padding: 9px 12px; font-weight: 400; color: var(--inchiostro); background: #fff; width: 100%; }
  dialog textarea { min-height: 76px; resize: vertical; }
  dialog .due { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  dialog label, dialog input, dialog select, dialog textarea { min-width: 0; }
  dialog { overflow-x: hidden; }
  dialog .piede { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
  dialog .suggerimento { background: var(--verde-bg); border-radius: 10px; padding: 8px 12px; font-size: .88rem; color: var(--bosco); }

  .impostazioni { display: grid; gap: 16px; max-width: 760px; }
  .box { background: #fff; border: 1px solid var(--linea); border-radius: 16px; padding: 18px 20px; }
  .box h3 { margin: 0 0 6px; font-family: var(--serif); font-weight: 600; color: var(--bosco); }
  .box p { color: var(--muschio); margin: 0 0 12px; }
  .intervalli { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
  .intervalli label { display: grid; gap: 4px; font-size: .85rem; font-weight: 700; color: var(--muschio); }
  .intervalli input { border: 1.5px solid var(--linea); border-radius: 8px; padding: 6px 8px; width: 100%; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--bosco); color: #fff; padding: 10px 18px; border-radius: 12px; box-shadow: var(--ombra); opacity: 0; transition: all .25s; z-index: 3000; pointer-events: none; }
  .toast.vis { opacity: 1; transform: translateX(-50%); }

  /* Sul campo */
  .gps { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  .gps .punto { width: 14px; height: 14px; border-radius: 50%; background: #9fb3a8; flex: none; box-shadow: 0 0 0 4px rgba(159,179,168,.25); }
  .gps.ok .punto { background: #1f6fd4; box-shadow: 0 0 0 4px rgba(31,111,212,.2); animation: battito 2s infinite; }
  @keyframes battito { 50% { box-shadow: 0 0 0 9px rgba(31,111,212,0); } }
  .gps b { display: block; } .gps small { color: var(--muschio); }
  .gps .btn { margin-left: auto; }
  .grandi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .grande { border: 0; border-radius: 16px; padding: 16px; text-align: left; background: var(--bosco); color: #fff; display: grid; gap: 6px; min-height: 92px; }
  .grande.chiaro { background: #fff; color: var(--bosco); border: 1.5px solid var(--linea); }
  .grande svg { width: 26px; height: 26px; }
  .grande b { font-size: 1.05rem; line-height: 1.2; }
  .vicini { display: grid; gap: 8px; }
  .vicino { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 10px 12px; text-align: left; width: 100%; }
  .vicino .dist { text-align: center; font-family: var(--serif); font-size: 1.25rem; color: var(--bosco); line-height: 1; }
  .vicino .dist small { display: block; font-family: var(--sans); font-size: .72rem; color: var(--muschio); margin-top: 3px; }
  .vicino .dist .freccia { display: block; font-size: 1.1rem; color: var(--foglia); margin-bottom: 2px; }
  .vicino b { display: block; line-height: 1.2; } .vicino small { color: var(--muschio); }
  .foto-riga { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .foto-riga img { width: 74px; height: 74px; object-fit: cover; border-radius: 8px; cursor: zoom-in; background: var(--crema); }
  .anteprime { display: flex; gap: 6px; flex-wrap: wrap; }
  .anteprime img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
  .btn-foto { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px dashed var(--foglia); color: var(--foglia); background: var(--verde-bg); border-radius: 12px; padding: 12px; font-weight: 700; cursor: pointer; }
  .btn-foto svg { width: 20px; height: 20px; }
  .zoom-foto { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 4000; display: grid; place-items: center; padding: 16px; }
  .zoom-foto img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .nuovo-tag { background: var(--germoglio); color: var(--bosco); }
  @media (max-width: 900px) {
    dialog { width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0; border-radius: 0; }
    dialog form { padding: 18px 16px 28px; }
    dialog input, dialog select, dialog textarea { font-size: 16px; padding: 11px 12px; }
    dialog .piede { position: sticky; bottom: 0; background: #fff; padding-top: 10px; }
    dialog .piede .btn { flex: 1; justify-content: center; padding: 12px; }
    .cassetto .azioni .btn { flex: 1 1 45%; justify-content: center; padding: 11px; }
  }
  @media (max-width: 900px) {
    body { font-size: 15px; }
    .testata .titolo { display: none; }
    .salvataggio span { display: none; }
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .menu { flex-direction: row; order: 2; padding: 4px; overflow-x: auto; gap: 0; }
    .menu button { flex-direction: column; gap: 2px; font-size: .6rem; padding: 6px 2px; flex: 1; min-width: 46px; overflow-wrap: anywhere; position: relative; text-align: center; align-items: center; }
    .menu button .cnt { position: absolute; top: 2px; right: 6px; margin: 0; }
    .menu .sep, .menu .piccolo { display: none; }
    .pagina { padding: 16px 14px 40px; }
    .colonne { grid-template-columns: 1fr; }
    .tabella-wrap { overflow-x: auto; }
    table { min-width: 720px; }
    dialog .due, .griglia-dati { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .griglia-dati .largo { grid-column: span 2; }
  }
  @media print {
    .testata, .menu, .filtri, .schede-stato, .altri, .no-stampa { display: none !important; }
    body, .app, .contenuto { display: block; overflow: visible; height: auto; background: #fff; }
    table { border: 0; } th { position: static; }
    .solo-stampa { display: block !important; }
  }
  .solo-stampa { display: none; }
  /* Accesso */
  .accesso { position: fixed; inset: 0; z-index: 5000; background: radial-gradient(90% 70% at 100% 0%, rgba(167,211,138,.25), transparent 60%), linear-gradient(160deg, var(--bosco-2), var(--bosco));
    display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
  .accesso .carta { background: var(--carta); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.35); width: min(440px, 100%); padding: 28px 26px; display: grid; gap: 14px; }
  .accesso img { height: 46px; justify-self: start; }
  .accesso h1 { margin: 6px 0 0; font-family: var(--serif); font-weight: 600; color: var(--bosco); font-size: 1.7rem; line-height: 1.1; }
  .accesso p { margin: 0; color: var(--muschio); line-height: 1.45; }
  .accesso label { display: grid; gap: 6px; font-weight: 700; font-size: .88rem; color: var(--muschio); }
  .accesso input { border: 1.5px solid var(--linea); border-radius: 12px; padding: 12px 14px; font-size: 16px; background: #fff; color: var(--inchiostro); width: 100%; }
  .accesso input:focus { outline: none; border-color: var(--foglia); box-shadow: 0 0 0 4px rgba(47,143,91,.15); }
  .accesso .btn { justify-content: center; padding: 12px; font-size: 1rem; }
  .accesso .msg { border-radius: 12px; padding: 10px 12px; font-size: .92rem; line-height: 1.4; }
  .accesso .msg.ok { background: var(--verde-bg); color: var(--bosco); }
  .accesso .msg.err { background: var(--rosso-bg); color: var(--rosso); }
  .accesso .barra-car { height: 6px; border-radius: 3px; background: var(--crema); overflow: hidden; }
  .accesso .barra-car i { display: block; height: 100%; width: 0; background: var(--foglia); transition: width .3s; }
  .accesso .piccolo { font-size: .82rem; color: var(--muschio); }
  .azioni-voce { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .azioni-voce button { border: 1px solid var(--linea); background: #fff; border-radius: 8px; padding: 3px 10px; font-size: .82rem; font-weight: 700; color: var(--muschio); }
  .azioni-voce button:hover { border-color: var(--foglia); color: var(--bosco); }
  .azioni-voce button.rosso { color: var(--rosso); }
  .azioni-voce button.rosso:hover { border-color: var(--rosso); }
  .mod { font-size: .78rem; color: var(--muschio); font-style: italic; margin-top: 4px; }
  .correzioni { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .fasi { display: flex; gap: 3px; margin-top: 6px; }
  .fasi i { flex: 1; height: 7px; border-radius: 4px; background: #e4e0d3; display: block; }
  .fasi i.ok { background: var(--foglia); } .fasi i.salta { background: #c9d6cd; } .fasi i.ora { background: var(--ambra); }
  .fase { border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; }
  .fase.fatta { background: var(--verde-bg); border-color: #cfe5d5; }
  .fase .tit { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fase .tit b { font-size: 1rem; }
  .fase .tit .num-fase { width: 26px; height: 26px; border-radius: 50%; background: var(--bosco); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
  .fase .tit label { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: .86rem; color: var(--muschio); }
  .fase .tit label input { width: auto; }
  .fase .desc { color: var(--muschio); font-size: .86rem; margin: -6px 0 0 36px; }
  .bilancio { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .riga-pratica { display: grid; grid-template-columns: 1fr minmax(160px, 260px) auto; gap: 14px; align-items: center; background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; }
  .riga-pratica small { color: var(--muschio); display: block; }
  @media (max-width: 700px) { .riga-pratica { grid-template-columns: 1fr; } }
  .colonna header svg { width: 18px; height: 18px; flex: none; }
  #chiSono { overflow-wrap: anywhere; }
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
/* =====================  Collegamento all'archivio (Supabase)  ===================== */
const SUPA_URL = "https://jqixnxfpvgynmsfhuywt.supabase.co", SUPA_KEY = "sb_publishable_oSeX6x0DqjUOl990wihZaw_lVF20PJZ";
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const CLOUD = (() => {
  const $c = s => document.querySelector(s);
  const escC = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const CODA = "verde-cloud-coda-v1";
  let coda = []; try { coda = JSON.parse(localStorage.getItem(CODA)) || []; } catch (e) {}
  let email = "", inviando = false, ultimoErrore = "", online = true, ascoltatori = [];
  const salvaCoda = () => { try { localStorage.setItem(CODA, JSON.stringify(coda)); } catch (e) {} };

  // foto in attesa di invio (rimangono sul dispositivo finché non sono caricate)
  const FotoCoda = {
    db: null,
    apri() { return this.db ? Promise.resolve(this.db) : new Promise((ok, ko) => { const r = indexedDB.open("verde-foto-coda", 1); r.onupgradeneeded = () => r.result.createObjectStore("f"); r.onsuccess = () => ok(this.db = r.result); r.onerror = () => ko(r.error); }); },
    async metti(id, d) { const db = await this.apri(); return new Promise((ok, ko) => { const t = db.transaction("f", "readwrite"); t.objectStore("f").put(d, id); t.oncomplete = ok; t.onerror = () => ko(t.error); }); },
    async prendi(id) { const db = await this.apri(); return new Promise(ok => { const r = db.transaction("f").objectStore("f").get(id); r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null); }); },
    async togli(id) { const db = await this.apri(); return new Promise(ok => { const t = db.transaction("f", "readwrite"); t.objectStore("f").delete(id); t.oncomplete = ok; t.onerror = ok; }); },
    async chiavi() { const db = await this.apri(); return new Promise(ok => { const r = db.transaction("f").objectStore("f").getAllKeys(); r.onsuccess = () => ok(r.result || []); r.onerror = () => ok([]); }); },
  };
  let fotoInAttesa = 0;
  const urlCache = new Map();

  function stato() {
    const n = coda.length + fotoInAttesa;
    if (ultimoErrore) return { testo: ultimoErrore, avviso: true };
    if (!online || (n && !inviando)) return { testo: n ? `Senza rete · ${n} modifiche in attesa` : "Senza rete", avviso: true };
    if (n) return { testo: `Sincronizzazione… (${n})`, avviso: false };
    return { testo: "Sincronizzato", avviso: false };
  }
  function avvisa() { ascoltatori.forEach(f => { try { f(); } catch (e) {} }); }

  async function svuota() {
    if (inviando) return;
    inviando = true;
    try {
      while (coda.length) {
        const w = coda[0];
        const { error } = w.del ? await sb.from(w.tab).delete().match(w.del) : await sb.from(w.tab).upsert(w.riga);
        if (error) {
          if (/fetch|network|Failed/i.test(error.message || "")) { online = false; break; }
          ultimoErrore = "Modifica non salvata: " + (error.message || error.code); console.error(error);
          coda.shift(); salvaCoda(); continue;
        }
        online = true; ultimoErrore = ""; coda.shift(); salvaCoda(); avvisa();
      }
      const chiavi = await FotoCoda.chiavi(); fotoInAttesa = chiavi.length;
      for (const id of chiavi) {
        const d = await FotoCoda.prendi(id); if (!d) { await FotoCoda.togli(id); continue; }
        const blob = await (await fetch(d)).blob();
        const { error } = await sb.storage.from("foto").upload(id + ".jpg", blob, { contentType: "image/jpeg", upsert: true });
        if (error) { if (/fetch|network|Failed/i.test(error.message || "")) { online = false; break; } console.error(error); break; }
        await FotoCoda.togli(id); fotoInAttesa--; avvisa();
      }
    } catch (e) { online = false; console.warn(e); }
    inviando = false; avvisa();
  }
  addEventListener("online", () => { online = true; svuota(); });
  addEventListener("offline", () => { online = false; avvisa(); });
  setInterval(() => { if (coda.length || fotoInAttesa) svuota(); }, 20000);

  async function tutte(tab, colonne = "*", ordine) {
    const out = []; let da = 0; const passo = 1000;
    for (;;) {
      let q = sb.from(tab).select(colonne).range(da, da + passo - 1);
      if (ordine) q = q.order(ordine);
      const { data, error } = await q;
      if (error) throw error;
      out.push(...data);
      if (data.length < passo) return out;
      da += passo;
    }
  }

  /* --------- schermate di accesso --------- */
  const carta = () => $c("#accessoCarta");
  const intestazione = `<img src="${document.querySelector("#accesso img").src}" alt="Comune di Monterotondo"><h1>Area di lavoro<br>Verde pubblico</h1>`;
  function mostraAccesso(msg, tipo) {
    $c("#accesso").hidden = false;
    let em = ""; try { em = localStorage.getItem("verde-ultima-email") || ""; } catch (e) {}
    carta().innerHTML = `${intestazione}
      <p>Accesso riservato all'Ufficio Ambiente.</p>
      ${msg ? `<div class="msg ${tipo || "ok"}">${msg}</div>` : ""}
      <form id="fPass" style="display:grid;gap:12px">
        <label>Email<input id="accEmail" type="email" autocomplete="username" required value="${escC(em)}" placeholder="nome@comune.monterotondo.rm.it"></label>
        <label>Password<input id="accPass" type="password" autocomplete="current-password" required></label>
        <button class="btn pieno" type="submit">Entra</button></form>
      <div class="piccolo" style="text-align:center;margin-top:4px">Primo accesso o password dimenticata?</div>
      <button class="btn" id="accLink" type="button">Ricevi un link di accesso via email</button>
      <div class="piccolo">Dopo l'accesso resterai collegato su questo dispositivo.</div>`;
    const ricorda = () => { const v = $c("#accEmail").value.trim().toLowerCase(); try { localStorage.setItem("verde-ultima-email", v); } catch (er) {} return v; };
    $c("#fPass").onsubmit = async e => {
      e.preventDefault();
      const em2 = ricorda();
      const b = e.target.querySelector("button"); b.disabled = true; b.textContent = "Accesso in corso…";
      const { error } = await sb.auth.signInWithPassword({ email: em2, password: $c("#accPass").value });
      if (error) mostraAccesso(/invalid/i.test(error.message) ? "Email o password non corretti. Se non hai ancora una password, tocca «Ricevi un link di accesso via email» e poi impostala in Impostazioni." : "Accesso non riuscito: " + escC(error.message), "err");
    };
    $c("#accLink").onclick = async () => {
      const inp = $c("#accEmail");
      if (!inp.value.trim() || !inp.checkValidity()) { inp.reportValidity(); return; }
      const em2 = ricorda();
      const b = $c("#accLink"); b.disabled = true; b.textContent = "Invio in corso…";
      const { error } = await sb.auth.signInWithOtp({ email: em2, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
      if (error) { mostraAccesso(/rate|limit/i.test(error.message) ? "Hai chiesto troppi link in poco tempo. Attendi qualche minuto e riprova." : "Invio non riuscito: " + escC(error.message), "err"); return; }
      mostraCodice(em2);
    };
  }
  function mostraCodice(em2) {
    carta().innerHTML = `${intestazione}
      <div class="msg ok">Ti abbiamo scritto a <b>${escC(em2)}</b>.</div>
      <p>Apri l'email e tocca il link <b>da questo stesso dispositivo</b>. Se l'email contiene un codice numerico, puoi anche scriverlo qui.</p>
      <form id="fCodice" style="display:grid;gap:12px"><label>Codice<input id="accCodice" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456"></label>
      <button class="btn pieno" type="submit">Entra</button></form>
      <button class="btn" id="accIndietro" type="button">Usa un'altra email</button>`;
    $c("#accIndietro").onclick = () => mostraAccesso();
    $c("#fCodice").onsubmit = async e => {
      e.preventDefault();
      const token = $c("#accCodice").value.trim(); if (!token) return;
      const { error } = await sb.auth.verifyOtp({ email: em2, token, type: "email" });
      if (error) { const m = $c("#fCodice").previousElementSibling; m.outerHTML = `<div class="msg err">Codice non valido o scaduto. Controlla l'ultima email ricevuta.</div>`; }
    };
  }
  function caricamento(testo, pct) {
    $c("#accesso").hidden = false;
    carta().innerHTML = `${intestazione}<p>${escC(testo)}</p><div class="barra-car"><i style="width:${pct || 5}%"></i></div>`;
  }

  /* --------- caricamento del censimento (solo la prima volta) --------- */
  function mostraImport() {
    carta().innerHTML = `${intestazione}
      <div class="msg ok">Archivio collegato. Manca solo il censimento.</div>
      <p>Scegli il file <b>censimento-per-archivio.json</b> che ti è stato consegnato (non va pubblicato online). Il caricamento si fa una volta sola.</p>
      <label class="btn pieno" style="cursor:pointer">Scegli il file del censimento<input type="file" id="fileCens" accept=".json,application/json" hidden></label>
      <button class="btn" id="accEsci" type="button">Esci</button>`;
    $c("#accEsci").onclick = () => sb.auth.signOut().then(() => location.reload());
    $c("#fileCens").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      let d; try { d = JSON.parse(await f.text()); } catch (er) { mostraImport(); return; }
      if (!d.meta || !Array.isArray(d.alberi)) { carta().insertAdjacentHTML("beforeend", `<div class="msg err">Il file non è quello del censimento.</div>`); return; }
      try {
        caricamento("Carico il censimento…", 5);

function scadenze() {
  const ordini = tuttiOrdini();
  const sett = piuGiorni(OGGI_S, 7), mese = piuGiorni(OGGI_S, 30);
  const R = { ritardo: [], settimana: [], mese: [] };
  ALBERI.forEach(a => {
    const s = stato(a); if (!s.prossimo || s.abbattuto) return;
    const fine = fineMese(s.prossimo), ini = inizio(s.prossimo);
    const v = { tipo: "controllo", a, data: s.prossimo, ord: ini };
    if (fine < OGGI_S) R.ritardo.push(v); else if (ini <= sett) R.settimana.push(v); else if (ini <= mese) R.mese.push(v);
  });
  ordini.forEach(o => {
    if (!o.data || o.stato === "fatto" || o.stato === "annullato") return;
    const v = { tipo: "ordine", o, a: PER_N.get(o.n), data: o.data, ord: o.data };
    if (o.data < OGGI_S) R.ritardo.push(v); else if (o.data <= sett) R.settimana.push(v); else if (o.data <= mese) R.mese.push(v);
  });
  Object.values(R).forEach(l => l.sort((p, q) => p.ord.localeCompare(q.ord)));
  return { R, ordini };
}

/* ---------- CONTROLLI ---------- */
const FC = { vista: "tutti", cerca: "", scuole: false, limite: 200 };
function rControlli(opz) {
  if (opz.f === "ritardo") Object.assign(FC, { vista: "ritardo", scuole: false, cerca: "" });
  if (opz.f === "30") Object.assign(FC, { vista: "30", scuole: false, cerca: "" });
  if (opz.scuole) Object.assign(FC, { vista: "tutti", scuole: true, cerca: "" });
  if (opz.cerca) Object.assign(FC, { vista: "tutti", scuole: false, cerca: opz.cerca });
  const lim30 = piuGiorni(OGGI_S, 30);
  let lista = ALBERI.filter(a => !stato(a).abbattuto).map(a => ({ a, s: stato(a) })).filter(({ a, s }) => {
    if (FC.scuole) { if (!(a.t === "Scuola" && ["C", "C/D", "D", "D1", "D2"].includes(s.cpc))) return false; }
    else if (!FC.cerca && !s.prossimo) return false;
    if (FC.vista === "ritardo" && !(s.prossimo && fineMese(s.prossimo) < OGGI_S)) return false;
    if (FC.vista === "30" && !(s.prossimo && fineMese(s.prossimo) >= OGGI_S && inizio(s.prossimo) <= lim30)) return false;
    if (FC.cerca) { const q = FC.cerca.toLowerCase(); if (![String(a.n), nomeSp(a), luogo(a), a.no, a.df].join(" ").toLowerCase().includes(q)) return false; }
    return true;

  const s = $('[data-pagina="controlli"]');
  s.innerHTML = `<h2>Controlli programmati</h2><p class="sotto">Lo scadenzario dei sopralluoghi. Quando registri un controllo, la data del successivo viene proposta in base alla classe di stabilità (modificabile in Impostazioni).</p>
    <div class="filtri"><div class="schede-stato">${[["tutti", "Tutti"], ["ritardo", "In ritardo"], ["30", "Prossimi 30 giorni"]].map(([k, t]) => `<button data-v="${k}" class="${FC.vista === k && !FC.scuole ? "attivo" : ""}">${t}</button>`).join("")}
      <button data-v="scuole" class="${FC.scuole ? "attivo" : ""}">Scuole classe ≥ C</button></div>
      <input type="search" id="fcCerca" placeholder="Cerca n. albero, specie, via, note…" value="${esc(FC.cerca)}"></div>
    <div class="tabella-wrap"><table><thead><tr><th>Scadenza</th><th>Albero</th><th>Classe</th><th>Luogo</th><th>Ultima nota</th><th></th></tr></thead><tbody>
    ${lista.slice(0, FC.limite).map(({ a, s: st }) => { const rit = st.prossimo && fineMese(st.prossimo) < OGGI_S; return `<tr class="cliccabile" data-n="${a.n}">
      <td class="num">${st.prossimo ? `<b style="color:${rit ? "var(--rosso)" : "inherit"}">${dataTxt(st.prossimo)}</b>${rit ? `<span class="sub" style="color:var(--rosso)">in ritardo</span>` : ""}` : "—"}</td>
      <td><b>n. ${num(a)}</b><span class="sub">${esc(nomeSp(a))}</span></td>
      <td>${st.cpc ? `<span class="cpc" style="background:${CPC_COL[st.cpc] || "#999"}">${esc(st.cpc)}</span>` : "—"}</td>
      <td>${esc(luogo(a))}<span class="sub">${esc(a.t)}</span></td>
      <td><span class="sub" style="max-width:340px">${esc((a.df || a.no || "").slice(0, 120))}</span></td>
      <td><button class="btn" data-reg="${a.n}">Registra controllo</button></td></tr>`; }).join("") || `<tr><td colspan="6" class="vuoto">Nessun controllo con questi filtri.</td></tr>`}
    </tbody></table></div>
    ${lista.length > FC.limite ? `<button class="altri" id="altriC">Mostra altri (${fmt(lista.length - FC.limite)})</button>` : ""}`;
  s.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { if (b.dataset.v === "scuole") { FC.scuole = true; FC.vista = "tutti"; } else { FC.scuole = false; FC.vista = b.dataset.v; } rControlli({}); });
  $("#fcCerca").oninput = e => { FC.cerca = e.target.value; clearTimeout(rControlli.t); rControlli.t = setTimeout(() => { rControlli({}); const i = $("#fcCerca"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
  if ($("#altriC")) $("#altriC").onclick = () => { FC.limite += 400; rControlli({}); };
  s.querySelectorAll("[data-reg]").forEach(b => b.onclick = e => { e.stopPropagation(); apriControllo(+b.dataset.reg); });
  s.querySelectorAll("tr[data-n]").forEach(r => r.onclick = () => apriAlbero(+r.dataset.n));
}

/* ---------- STORICO ---------- */
const FS = { tipo: "", cerca: "", limite: 150, base: false };
function tuttiEventi() {
  const ev = [];
  DB.eventi.forEach(e => ev.push(e));
  if (FS.base) ALBERI.forEach(a => eventiAlbero(a).filter(e => e.base && e.tipo !== "censimento").forEach(e => ev.push(Object.assign({ n: a.n }, e))));
  return ev.sort((p, q) => (q.data || "0").localeCompare(p.data || "0") || (q.ts || 0) - (p.ts || 0));
}
function rStorico() {
  let ev = tuttiEventi().filter(e => (!FS.tipo || e.tipo === FS.tipo) && (!FS.cerca || [e.n, e.testo, e.ditta, e.chi, PER_N.get(e.n) && luogo(PER_N.get(e.n))].join(" ").toLowerCase().includes(FS.cerca.toLowerCase())));
  const s = $('[data-pagina="storico"]');
  let html = `<h2>Storico</h2><p class="sotto">Il registro di tutto quello che è stato fatto: controlli, interventi, programmazioni e note, con data e operatore. Ogni voce resta collegata alla scheda dell'albero.</p>
    <div class="filtri"><select id="fsTipo"><option value="">Tutti i tipi</option>${Object.entries(TIPI_EV).map(([k, v]) => `<option value="${k}" ${FS.tipo === k ? "selected" : ""}>${v.nome}</option>`).join("")}</select>
      <input type="search" id="fsCerca" placeholder="Cerca n. albero, via, testo, ditta…" value="${esc(FS.cerca)}">
      <label style="display:flex;gap:6px;align-items:center;font-size:.9rem;color:var(--muschio)"><input type="checkbox" id="fsBase" ${FS.base ? "checked" : ""}> includi gli interventi registrati nel censimento</label></div>`;
  if (!ev.length) html += `<div class="box"><h3>Ancora nessuna attività registrata</h3><p>Quando registri un controllo, programmi o chiudi un intervento, la voce compare qui. Spunta la casella sopra per vedere anche gli interventi già annotati nel censimento.</p></div>`;
  else {
    let mese = "";
    html += `<ul class="timeline">`;
    ev.slice(0, FS.limite).forEach(e => {
      const m = (e.data || "").slice(0, 7);
      if (m !== mese) { mese = m; html += `</ul><div class="mese-t">${m ? (m.length === 7 ? dataTxt(m) : m) : "Senza data"}</div><ul class="timeline">`; }
      const T = TIPI_EV[e.tipo] || TIPI_EV.nota, a = PER_N.get(e.n);
      html += `<li><span class="ic" style="background:${T.bg};color:${T.col}">${svg(T.ic)}</span><div class="riga"><header><b>${T.nome}</b>${a ? `<button class="albero" data-n="${a.n}">n. ${num(a)} · ${esc(nomeSp(a))}</button>` : ""}<time>${dataTxt(e.data)}</time></header>
        <p>${esc(e.testo)}${a ? ` · ${esc(luogo(a))}` : ""}</p>${fotoHtml(e.foto)}${e.chi || e.ditta || e.costo ? `<div class="chi">${[e.chi && "Registrato da " + esc(e.chi), e.ditta && "Ditta: " + esc(e.ditta), e.costo && "Costo: € " + esc(e.costo)].filter(Boolean).join(" · ")}</div>` : ""}${e.base ? "" : azioniVoce(e)}</div></li>`;
    });
    html += `</ul>${ev.length > FS.limite ? `<button class="altri" id="altriS">Mostra altri (${fmt(ev.length - FS.limite)})</button>` : ""}`;
  }
  s.innerHTML = html;
  $("#fsTipo").onchange = e => { FS.tipo = e.target.value; rStorico(); };
  $("#fsBase").onchange = e => { FS.base = e.target.checked; rStorico(); };
  $("#fsCerca").oninput = e => { FS.cerca = e.target.value; clearTimeout(rStorico.t); rStorico.t = setTimeout(() => { rStorico(); const i = $("#fsCerca"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
  if ($("#altriS")) $("#altriS").onclick = () => { FS.limite += 300; rStorico(); };
  collegaVoci(s); caricaFoto(s); collegaAzioniVoce(s);
}

/* ---------- MAPPA ---------- */
let mappa, stratoM, marker = new Map();
function coloreLavoro(a, aperti) {
  const s = stato(a);
  if (s.abbattuto) return "#5a5a5a";
  const rit = s.prossimo && fineMese(s.prossimo) < OGGI_S;
  const ord = aperti.get(a.n);
  if (rit || (ord && ord.prio === "alta")) return "#c8372d";
  if (s.prossimo && inizio(s.prossimo) <= piuGiorni(OGGI_S, 30)) return "#d9761e";
  if (ord) return "#2a6fb5";
  return "#9fb3a8";
}
function rMappa(opz) {
  if (!mappa) {
    mappa = L.map("mappaLavoro", { preferCanvas: true, zoomControl: true, maxZoom: 21 });
    const strade = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 21, maxNativeZoom: 19, attribution: "© Esri, OpenStreetMap" });
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 21, maxNativeZoom: 19, attribution: "© Esri" });
    strade.addTo(mappa);
    L.control.layers({ "Mappa": strade, "Satellite": sat }, null, { position: "topright" }).addTo(mappa);
    stratoM = L.layerGroup().addTo(mappa);
    mappa.fitBounds(L.latLngBounds(ALBERI.map(a => [a.y, a.x])).pad(.03));
  }
  setTimeout(() => mappa.invalidateSize(), 50);
  const aperti = new Map();
  tuttiOrdini().filter(o => o.stato !== "fatto" && o.stato !== "annullato").forEach(o => { const p = aperti.get(o.n); if (!p || ORD_PESO[o.prio] < ORD_PESO[p.prio]) aperti.set(o.n, o); });
  stratoM.clearLayers();
  const filtro = a => opz.nuovi ? a.ni : opz.genere ? (SPECIE[a.s][1] || "").startsWith(opz.genere) : opz.palme ? (/^(Phoenix|Washingtonia|Chamaerops)/.test(SPECIE[a.s][1] || "") || /Palma/.test(SPECIE[a.s][0] || "")) : true;
  const vis = ALBERI.filter(filtro);
  const ordine = c => ({ "#9fb3a8": 0, "#2a6fb5": 1, "#d9761e": 2, "#c8372d": 3, "#5a5a5a": 0 })[c];
  vis.map(a => ({ a, c: coloreLavoro(a, aperti) })).sort((p, q) => ordine(p.c) - ordine(q.c)).forEach(({ a, c }) => {
    const m = L.circleMarker(posAlbero(a), { radius: c === "#9fb3a8" ? 3.5 : 5.5, color: "#fff", weight: 1, fillColor: c, fillOpacity: .95, bubblingMouseEvents: false });
    m.bindTooltip(`n. ${num(a)} · ${esc(nomeSp(a))}`, { className: "tt", direction: "top" });
    m.on("click", () => apriAlbero(a.n));
    stratoM.addLayer(m);
  });
  if (opz.nuovi || opz.genere || opz.palme) { mappa.fitBounds(L.latLngBounds(vis.map(a => [a.y, a.x])).pad(.1)); toast(`${fmt(vis.length)} alberi evidenziati`); }
  if (opz.n) { const a = PER_N.get(opz.n); mappa.setView(posAlbero(a), 19); }
  if (opz.qui && !POS) avviaGps(() => { if (pagina === "mappa") rMappa({ qui: true }); });
  if (POS) {
    L.circle(POS.ll, { radius: POS.acc, color: "#1f6fd4", weight: 1, fillOpacity: .08, interactive: false }).addTo(stratoM);
    L.circleMarker(POS.ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#1f6fd4", fillOpacity: 1, interactive: false }).addTo(stratoM);
    if (opz.qui) mappa.setView(POS.ll, 19);
  }
}

  if ($("#cDelNuovo")) $("#cDelNuovo").onclick = () => eliminaNuovo(n);
  $("#cPos").onclick = () => {
    if (!navigator.geolocation) return toast("Posizione non disponibile");
    toast("Rilevo la posizione…");
    navigator.geolocation.getCurrentPosition(p => {
      const ll = [p.coords.latitude, p.coords.longitude], acc = Math.round(p.coords.accuracy);
      const sp = Math.round(distanza(posAlbero(a), ll));
      if (!confirm(`Nuova posizione con precisione ± ${acc} m, a ${sp} m dal punto attuale. Confermi?`)) return;
      DB.alberi[n] = Object.assign(DB.alberi[n] || {}, { pos: ll }); scriviAlbero(n);
      registra({ tipo: "nota", n, data: OGGI_S, testo: `Posizione aggiornata col GPS (spostata di ${sp} m, precisione ± ${acc} m)` });
      toast("Posizione aggiornata");
    }, () => toast("Posizione non disponibile"), { enableHighAccuracy: true, timeout: 20000 });
  };
}
function chiudiAlbero() { $("#cassetto").classList.remove("aperto"); $("#velo").classList.remove("aperto"); albAperto = null; }
$("#velo").onclick = chiudiAlbero;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.querySelector("dialog[open]")) chiudiAlbero(); });
function registra(ev) {

function apriControllo(n) {

  const f = $("#formControllo");
  f.innerHTML = `<h3>Registra controllo</h3><p class="sotto">Albero n. ${num(a)} · ${esc(nomeSp(a))} · ${esc(luogo(a))}</p>
    <div class="due"><label>Data del controllo<input type="date" name="data" value="${OGGI_S}" required></label>
      <label>Classe CPC rilevata<select name="cpc"><option value="">—</option>${CPC_LISTA.map(k => `<option ${s.cpc === k ? "selected" : ""}>${k}</option>`).join("")}</select></label></div>
    <label>Esito e difetti osservati<textarea name="testo" placeholder="Es. chioma in buono stato, carie al colletto stabile, nessun nuovo difetto…"></textarea></label>
    <div class="due"><label>Prossimo controllo<input type="date" name="prossimo"></label><label>Operatore<input name="chi" value="${esc(ioNome())}"></label></div>
    <div class="suggerimento" id="sugg"></div>
    ${campoFoto("foto")}
    <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" name="abbattuto" style="width:auto"> L'albero è stato abbattuto / non è più presente</label>
    <div class="piede"><button class="btn" value="annulla" formnovalidate>Annulla</button><button class="btn pieno" value="ok">Salva controllo</button></div>`;
  const aggSugg = () => {
    const c = f.cpc.value, mesi = DB.impostazioni.mesi[c];
    if (c && mesi) { const p = piuMesi(f.data.value || OGGI_S, mesi); f.prossimo.value = p; $("#sugg").textContent = `Proposta: classe ${c} → nuovo controllo tra ${mesi} mesi (${dataTxt(p)}). Puoi cambiarla.`; }
    else $("#sugg").textContent = "Scegli la classe per avere una proposta di data del prossimo controllo.";
  };
  f.cpc.onchange = aggSugg; f.data.onchange = aggSugg; aggSugg();
  collegaAnteprime(f, "foto");
  const dlg = $("#dlgControllo");
  dlg.onclose = async () => {

function apriOrdine(id, nNuovo) {
  const tutti = tuttiOrdini();
  const o = id ? tutti.find(x => x.id === id) : { id: "N" + nuovoId(), n: nNuovo, cat: "potatura", testo: "", stato: "da", data: "", ditta: "", costo: "", note: "", nuovo: true };
  const a = PER_N.get(o.n);
  const ditte = [...new Set(tutti.map(x => x.ditta).filter(Boolean).concat(DB.impostazioni.ditte))];
  const f = $("#formOrdine");
  f.innerHTML = `<h3>${o.nuovo ? "Nuovo intervento" : esc(CAT[o.cat])}</h3><p class="sotto">Albero n. ${num(a)} · ${esc(nomeSp(a))} · ${esc(luogo(a))}${o.origine ? " · da " + esc(o.origine) : ""}</p>
    <div class="due"><label>Tipo<select name="cat">${PRIO_CAT.map(k => `<option value="${k}" ${o.cat === k ? "selected" : ""}>${CAT[k]}</option>`).join("")}</select></label>
      <label>Priorità<select name="prio"><option value="">Automatica (${o.prio || priorita(a, o.cat)})</option>${["alta", "media", "bassa"].map(k => `<option ${o.prioManuale === k ? "selected" : ""}>${k}</option>`).join("")}</select></label></div>
    <label>Descrizione / prescrizione<textarea name="testo" required>${esc(o.testo)}</textarea></label>
    <div class="due"><label>Stato<select name="stato">${Object.entries(STATI).map(([k, t]) => `<option value="${k}" ${o.stato === k ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label>Data (programmata o di esecuzione)<input type="date" name="data" value="${esc(o.data)}"></label></div>
    <div class="due"><label>Ditta / squadra<input name="ditta" list="listaDitte" value="${esc(o.ditta)}"><datalist id="listaDitte">${ditte.map(d => `<option value="${esc(d)}">`).join("")}</datalist></label>
      <label>Costo (€)<input name="costo" inputmode="decimal" value="${esc(o.costo)}"></label></div>
    <label>Note<textarea name="note">${esc(o.note)}</textarea></label>
    <div class="suggerimento">Quando lo segni come <b>Eseguito</b>, l'intervento entra nello storico dell'albero.${o.cat === "abbattimento" ? " Per un abbattimento l'albero verrà segnato come non più presente." : ""}</div>
    <div class="piede"><button class="btn" value="albero" formnovalidate>Apri scheda albero</button>${o.manuale && !o.nuovo ? `<button class="btn rosso" value="elimina" formnovalidate>Elimina intervento</button>` : (!o.nuovo && DB.ordini[o.id] ? `<button class="btn" value="ripristina" formnovalidate>Ripristina dal censimento</button>` : "")}<span style="flex:1"></span><button class="btn" value="annulla" formnovalidate>Annulla</button><button class="btn pieno" value="ok">Salva</button></div>`;
  const dlg = $("#dlgOrdine");
  dlg.onclose = () => {
    if (dlg.returnValue === "albero") { apriAlbero(o.n); return; }
    if (dlg.returnValue === "elimina" || dlg.returnValue === "ripristina") {
      const del = dlg.returnValue === "elimina";
      if (!confirm(del ? "Eliminare questo intervento? Non si può annullare." : "Annullare tutte le modifiche a questo intervento e tornare a com'era nel censimento?")) return;
      delete DB.ordini[o.id]; CLOUD.elimina("ordini", { id: o.id });
      toast(del ? "Intervento eliminato" : "Intervento ripristinato"); aggiorna(); if (albAperto) apriAlbero(albAperto);
      return;
    }
    if (dlg.returnValue !== "ok") return;
    const v = Object.fromEntries(new FormData(f));
    if (v.stato === "fatto" && !v.data) v.data = OGGI_S;
    const prima = o.stato;
    const campi = { cat: v.cat, prioManuale: v.prio || "", testo: v.testo, stato: v.stato, data: v.data, ditta: v.ditta, costo: v.costo, note: v.note };
    if (o.nuovo) DB.ordini[o.id] = Object.assign({ manuale: true, id: o.id, n: o.n, origine: "Inserito a mano" }, campi);
    else DB.ordini[o.id] = Object.assign(DB.ordini[o.id] || {}, campi);
    scriviOrdine(o.id);
    if (v.ditta && !DB.impostazioni.ditte.includes(v.ditta)) { DB.impostazioni.ditte.push(v.ditta); scriviImpostazioni(); }
    if (v.stato !== prima || o.nuovo) {
      if (v.stato === "fatto") {
        if (v.cat === "abbattimento") { DB.alberi[o.n] = Object.assign(DB.alberi[o.n] || {}, { abbattuto: true }); scriviAlbero(o.n); }
        registra({ tipo: "intervento", n: o.n, data: v.data, testo: CAT[v.cat] + ": " + v.testo + (v.note ? ". " + v.note : ""), ditta: v.ditta, costo: v.costo, ordine: o.id });
      } else if (v.stato === "prog" || v.stato === "corso") {
        registra({ tipo: "ordine", n: o.n, data: OGGI_S, testo: `${CAT[v.cat]} ${v.stato === "prog" ? "programmato" + (v.data ? " per il " + dataTxt(v.data) : "") : "avviato"}`, ditta: v.ditta, ordine: o.id });
      } else { salva(); aggiorna(); if (albAperto) apriAlbero(albAperto); }
    } else { salva(); if (albAperto) apriAlbero(albAperto); aggiorna(); }
    toast("Intervento salvato");
  };
  dlg.returnValue = ""; dlg.showModal();
}

function scarica(blob, nome) { const u = URL.createObjectURL(blob), l = document.createElement("a"); l.href = u; l.download = nome; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); }

/* ---------- Abbattimenti e sostituzioni ---------- */
const FASI = [
  { k: "perizia", nome: "Perizia", desc: "Valutazione tecnica che motiva l'abbattimento (classe, difetti, prove strumentali, foto)." },
  { k: "autorizzazione", nome: "Autorizzazione", desc: "Atto che autorizza l'abbattimento (determina, ordinanza, eventuali pareri)." },
  { k: "comunicazione", nome: "Comunicazione", desc: "Avviso ai cittadini, alla scuola o ai residenti, se necessario." },
  { k: "esecuzione", nome: "Abbattimento", desc: "Esecuzione dei lavori e rimozione della ceppaia." },
  { k: "ripiantumazione", nome: "Nuovo albero", desc: "Messa a dimora del nuovo albero nello stallo rimasto vuoto (o in un altro stallo libero)." },
  { k: "garanzia", nome: "Garanzia di attecchimento", desc: "Controlli e irrigazione nei primi anni; sostituzione se la pianta non attecchisce." },
];
const impAbb = () => Object.assign({ garanziaMesi: 24, sostituzione: true }, DB.impostazioni.abbattimenti || {});
const praticaDi = n => Object.values(DB.pratiche).find(p => p.n === n);
const salvaPratica = p => { p.aggiornata = OGGI_S; DB.pratiche[p.id] = p; CLOUD.scrivi("pratiche", { id: p.id, n: p.n, dati: p, aggiornato_il: new Date().toISOString() }); };
const faseOk = (p, k) => p.fasi[k] && (p.fasi[k].fatto || p.fasi[k].nonServe);
function statoPratica(p) {
  if (p.chiusa) return { k: "conclusa", testo: "Conclusa", col: "s-fatto" };
  const f = FASI.find(f => !faseOk(p, f.k));
  if (!f) return { k: "conclusa", testo: "Conclusa", col: "s-fatto" };
  if (f.k === "garanzia") return { k: "garanzia", testo: "In garanzia" + (p.fasi.garanzia && p.fasi.garanzia.fine ? " fino a " + dataTxt(p.fasi.garanzia.fine) : ""), col: "s-prog", fase: f };
  return { k: "corso", testo: "Prossimo passo: " + f.nome.toLowerCase(), col: f.k === "ripiantumazione" ? "p-alta" : "s-corso", fase: f };
}

async function generaBilancio(ym, btn) {

    const { data, error } = await sb.functions.invoke("promemoria", { body: { bilancio: ym } });
    if (error) throw error;
    if (!data || data.errore) throw new Error((data && data.errore) || "risposta vuota");
    DB.bilanci = DB.bilanci || {}; DB.bilanci[data.bilancio.mese] = data.bilancio;
    toast("Bilancio di " + nomeMese(ym) + " pronto"); rAbbattimenti({});

        DB.alberi[n] = { prossimo: piuMesi(rp.data || OGGI_S, 6) }; scriviAlbero(n);
        if (sito) { DB.alberi[sito.n] = Object.assign(DB.alberi[sito.n] || {}, { abbattuto: true }); scriviAlbero(sito.n); registra({ tipo: "nota", n: sito.n, data: OGGI_S, testo: `Stallo occupato dal nuovo albero n. ${n}` }); }
        registra({ tipo: "impianto", n, data: rp.data || OGGI_S, testo: `Messo a dimora in sostituzione dell'albero n. ${num(a)} (${nomeSp(a)})` });
        p.nuovoN = n;
        if (!p.fasi.garanzia.fine) p.fasi.garanzia.fine = piuMesi(rp.data || OGGI_S, I.garanziaMesi);
      }
    }
    if (rp.fatto && p.fasi.garanzia && !p.fasi.garanzia.fine) p.fasi.garanzia.fine = piuMesi(rp.data || OGGI_S, I.garanziaMesi);
    if (p.fasi.garanzia.esito === "attecchito") { p.fasi.garanzia.fatto = true; p.chiusa = true; } else p.chiusa = false;
    salvaPratica(p); toast("Pratica salvata"); aggiorna(); if (albAperto) apriAlbero(albAperto);
  };
  dlg.returnValue = ""; dlg.showModal();
}

/* ---------- Modifica ed eliminazione ---------- */
const azioniVoce = e => `<div class="azioni-voce"><button data-mod-ev="${esc(e.id)}">Modifica</button><button class="rosso" data-del-ev="${esc(e.id)}">Elimina</button></div>` +
  (e.modificato ? `<div class="mod">Modificata da ${esc(e.modificato.chi)} il ${dataTxt(e.modificato.il)}</div>` : "");
function collegaAzioniVoce(el) {
  el.querySelectorAll("[data-mod-ev]").forEach(b => b.onclick = ev => { ev.stopPropagation(); modificaVoce(b.dataset.modEv); });
  el.querySelectorAll("[data-del-ev]").forEach(b => b.onclick = ev => { ev.stopPropagation(); eliminaVoce(b.dataset.delEv); });
}
const salvaEvento = ev => CLOUD.scrivi("eventi", { id: ev.id, n: ev.n ?? null, tipo: ev.tipo, data: ev.data || null, dati: ev });
function dopoModifica(msg) { toast(msg); aggiorna(); if (albAperto) apriAlbero(albAperto); }
function modificaVoce(id) {
  const ev = DB.eventi.find(e => e.id === id); if (!ev) return;
  const T = TIPI_EV[ev.tipo] || TIPI_EV.nota, a = PER_N.get(ev.n);
  const f = $("#formVoce");
  const data = (ev.data || "").length === 10 ? ev.data : "";
  f.innerHTML = `<h3>Modifica: ${esc(T.nome.toLowerCase())}</h3><p class="sotto">${a ? `Albero n. ${num(a)} · ${esc(nomeSp(a))}` : ""}${ev.chi ? " · registrata da " + esc(ev.chi) : ""}</p>
    <label>Data<input type="date" name="data" value="${esc(data)}"></label>
    <label>Testo<textarea name="testo" required>${esc(ev.testo)}</textarea></label>
    ${ev.tipo === "intervento" ? `<div class="due"><label>Ditta / squadra<input name="ditta" value="${esc(ev.ditta)}"></label><label>Costo (€)<input name="costo" inputmode="decimal" value="${esc(ev.costo)}"></label></div>` : ""}
    <div class="suggerimento">La voce resta nello storico con l'indicazione "modificata da ${esc(ioNome())}".</div>
    <div class="piede"><button class="btn" value="annulla" formnovalidate>Annulla</button><button class="btn pieno" value="ok">Salva modifica</button></div>`;
  const dlg = $("#dlgVoce");
  dlg.onclose = () => {
    if (dlg.returnValue !== "ok") return;
    const v = Object.fromEntries(new FormData(f));
    Object.assign(ev, { testo: v.testo, modificato: { chi: ioNome(), il: OGGI_S } }, v.data ? { data: v.data } : {}, ev.tipo === "intervento" ? { ditta: v.ditta, costo: v.costo } : {});
    salvaEvento(ev); dopoModifica("Voce modificata");
  };
  dlg.returnValue = ""; dlg.showModal();
}
function eliminaVoce(id) {
  const ev = DB.eventi.find(e => e.id === id); if (!ev) return;
  const avviso = ev.tipo === "intervento" ? "\n\nL'intervento resterà segnato come eseguito: se serve, riaprilo dalla lista Interventi." :
    ev.tipo === "controllo" ? "\n\nLa classe e la data del prossimo controllo restano quelle attuali: se serve, usa \"Correggi dati\" nella scheda." : "";
  if (!confirm("Eliminare questa voce dallo storico? Non si può annullare." + avviso)) return;
  DB.eventi = DB.eventi.filter(e => e.id !== id);
  CLOUD.elimina("eventi", { id });
  dopoModifica("Voce eliminata");
}
function correggiDati(n) {
  const a = PER_N.get(n), s = stato(a);
  const f = $("#formDati");
  f.innerHTML = `<h3>Correggi dati</h3><p class="sotto">Albero n. ${num(a)} · ${esc(nomeSp(a))} · ${esc(luogo(a))}</p>
    <div class="due"><label>Classe CPC<select name="cpc"><option value="">—</option>${CPC_LISTA.map(k => `<option ${s.cpc === k ? "selected" : ""}>${k}</option>`).join("")}</select></label>
      <label>Sviluppo<select name="sviluppo"><option value="">—</option>${["Giovane", "Adulta", "Matura", "Senescente", "Secco"].map(k => `<option ${s.sviluppo === k ? "selected" : ""}>${k}</option>`).join("")}</select></label></div>
    <label>Prossimo controllo<input type="date" name="prossimo" value="${(s.prossimo || "").length === 10 ? esc(s.prossimo) : ""}"></label>
    ${s.prossimo && s.prossimo.length === 7 ? `<p class="sotto" style="margin:0">Ora è fissato a <b>${dataTxt(s.prossimo)}</b>: lascia vuoto per non cambiarlo.</p>` : ""}
    <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" name="abbattuto" style="width:auto" ${s.abbattuto ? "checked" : ""}> L'albero non è più presente</label>
    ${a.nuovo ? "" : `<div class="sezione-t" style="margin:6px 0 0">Dati della scheda</div>
    <label>Specie (nome comune)<input name="com" list="dlSpecie3" value="${esc(nomeSp(a))}"><datalist id="dlSpecie3">${[...new Set(SPECIE.map(x => x[0]).filter(Boolean))].sort((p, q) => p.localeCompare(q, "it")).map(x => `<option value="${esc(x)}">`).join("")}</datalist></label>
    <label>Luogo<input name="areaNome" list="dlAree3" value="${esc(luogo(a))}"><datalist id="dlAree3">${[...new Set(AREE.map(x => x[0]))].sort((p, q) => p.localeCompare(q, "it")).map(x => `<option value="${esc(x)}">`).join("")}</datalist></label>
    <div class="due"><label>Diametro tronco (cm)<input name="d" type="number" inputmode="numeric" value="${a.d || ""}"></label><label>Diametro chioma (m)<input name="c" type="number" inputmode="numeric" value="${a.c || ""}"></label></div>
    <label>Classe altezza (m)<select name="h"><option value="">—</option>${["<8", "8-12", "12-18", "18-22", "22-30"].map(k => `<option ${a.h === k ? "selected" : ""}>${k}</option>`).join("")}</select></label>
    <label>Difetti<textarea name="df">${esc(a.df)}</textarea></label>
    <label>Note<input name="no" value="${esc(a.no)}"></label>`}
    <label>Motivo della correzione<input name="motivo" placeholder="Es. classe inserita per errore"></label>
    <div class="piede"><button class="btn" value="annulla" formnovalidate>Annulla</button><button class="btn pieno" value="ok">Salva correzione</button></div>`;
  const dlg = $("#dlgDati");
  dlg.onclose = () => {
    if (dlg.returnValue !== "ok") return;
    const v = Object.fromEntries(new FormData(f));
    const nuovo = { cpc: v.cpc, sviluppo: v.sviluppo, abbattuto: !!v.abbattuto };
    if (v.prossimo) nuovo.prossimo = v.prossimo;
    const cambi = [];
    if (nuovo.cpc !== s.cpc) cambi.push(`classe ${s.cpc || "—"} → ${nuovo.cpc || "—"}`);
    if (nuovo.sviluppo !== s.sviluppo) cambi.push(`sviluppo ${s.sviluppo || "—"} → ${nuovo.sviluppo || "—"}`);
    if (v.prossimo && v.prossimo !== s.prossimo) cambi.push(`prossimo controllo ${s.prossimo ? dataTxt(s.prossimo) : "—"} → ${dataTxt(v.prossimo)}`);
    if (nuovo.abbattuto !== s.abbattuto) cambi.push(nuovo.abbattuto ? "segnato come non più presente" : "di nuovo presente");
    if (!a.nuovo) {
      const campi = {};
      const conf = [["com", "specie", nomeSp(a)], ["areaNome", "luogo", luogo(a)], ["d", "tronco", a.d], ["c", "chioma", a.c], ["h", "altezza", a.h], ["df", "difetti", a.df], ["no", "note", a.no]];
      for (const [k, etich, prima] of conf) {
        const val = (k === "d" || k === "c") ? (+v[k] || 0) : (v[k] || "");
        if (String(val) !== String(prima ?? (k === "d" || k === "c" ? 0 : ""))) { campi[k] = val; cambi.push(`${etich}: ${prima || "—"} → ${val || "—"}`); }
      }
      if (Object.keys(campi).length) nuovo.campi = Object.assign({}, (DB.alberi[n] || {}).campi || {}, campi);
    }
    if (!cambi.length) { toast("Nessuna modifica"); return; }
    DB.alberi[n] = Object.assign(DB.alberi[n] || {}, nuovo);
    applicaCampi(n);
    scriviAlbero(n);
    registra({ tipo: "nota", n, data: OGGI_S, testo: "Dati corretti: " + cambi.join("; ") + (v.motivo ? ". Motivo: " + v.motivo : "") });
    toast("Dati corretti");
  };
  dlg.returnValue = ""; dlg.showModal();
}
// i dati della scheda corretti sul campo sostituiscono quelli del censimento (l'originale resta in a._orig)
function applicaCampi(n) {
  const a = PER_N.get(n); if (!a || a.nuovo) return;
  if (!a._orig) a._orig = { s: a.s, a: a.a, d: a.d, c: a.c, h: a.h, df: a.df, no: a.no };
  Object.assign(a, a._orig);
  const c = (DB.alberi[n] || {}).campi; if (!c) return;
  if (c.com !== undefined) a.s = indiceSpecie(c.com, "");
  if (c.areaNome !== undefined) a.a = indiceArea(c.areaNome);
  for (const k of ["d", "c", "h", "df", "no"]) if (c[k] !== undefined) a[k] = c[k];
}
function ripristinaAlbero(n) {
  if (!confirm("Tornare ai dati del censimento per questo albero?\nClasse, prossimo controllo, sviluppo e posizione tornano quelli originali. Lo storico resta.")) return;
  delete DB.alberi[n]; applicaCampi(n); CLOUD.elimina("alberi_mod", { n });
  registra({ tipo: "nota", n, data: OGGI_S, testo: "Ripristinati i dati del censimento" });
  toast("Dati del censimento ripristinati");
}
function modificaNuovo(n) {
  const r = DB.nuoviAlberi.find(x => x.n === n), a = PER_N.get(n); if (!r || !a) return;
  const f = $("#formDati");
  const nomiSp = [...new Set(SPECIE.map(x => x[0]).filter(Boolean))].sort((p, q) => p.localeCompare(q, "it"));
  const nomiAree = [...new Set(AREE.map(x => x[0]))].sort((p, q) => p.localeCompare(q, "it"));
  f.innerHTML = `<h3>Modifica albero nuovo</h3><p class="sotto">Scheda n. ${num(a)} · censito il ${dataTxt(r.data || OGGI_S)}</p>
    <label>Specie (nome comune)<input name="com" list="dlSpecie2" required value="${esc(r.com)}"><datalist id="dlSpecie2">${nomiSp.map(x => `<option value="${esc(x)}">`).join("")}</datalist></label>
    <label>Luogo<input name="areaNome" list="dlAree2" required value="${esc(r.areaNome)}"><datalist id="dlAree2">${nomiAree.map(x => `<option value="${esc(x)}">`).join("")}</datalist></label>
    <div class="due"><label>Tipologia<select name="t">${["Stradale", "Parchi", "Verde attrezzato", "Scuola", "Altro"].map(k => `<option ${r.t === k ? "selected" : ""}>${k}</option>`).join("")}</select></label>
      <label>Classe altezza (m)<select name="h"><option value="">—</option>${["<8", "8-12", "12-18", "18-22", "22-30"].map(k => `<option ${r.h === k ? "selected" : ""}>${k}</option>`).join("")}</select></label></div>
    <div class="due"><label>Diametro tronco (cm)<input name="d" type="number" inputmode="numeric" value="${r.d || ""}"></label><label>Diametro chioma (m)<input name="c" type="number" inputmode="numeric" value="${r.c || ""}"></label></div>
    <label>Difetti<textarea name="df">${esc(r.df)}</textarea></label>
    <label>Note<input name="no" value="${esc(r.no)}"></label>
    <div class="piede"><button class="btn" value="annulla" formnovalidate>Annulla</button><button class="btn pieno" value="ok">Salva</button></div>`;
  const dlg = $("#dlgDati");
  dlg.onclose = () => {
    if (dlg.returnValue !== "ok") return;
    const v = Object.fromEntries(new FormData(f));
    const sp = SPECIE.find(x => x[0].toLowerCase() === v.com.toLowerCase());
    Object.assign(r, { com: v.com, bot: sp ? sp[1] : "", areaNome: v.areaNome, t: v.t, h: v.h, d: +v.d || 0, c: +v.c || 0, df: v.df, no: v.no });
    Object.assign(a, r, { s: indiceSpecie(r.com, r.bot), a: indiceArea(r.areaNome) });
    CLOUD.scrivi("nuovi_alberi", { n, dati: r });
    registra({ tipo: "nota", n, data: OGGI_S, testo: "Dati dell'albero nuovo modificati" });
    toast("Albero aggiornato");
  };
  dlg.returnValue = ""; dlg.showModal();
}
function rimuoviNuovo(n) {
  DB.nuoviAlberi = DB.nuoviAlberi.filter(x => x.n !== n);
  const i = ALBERI.findIndex(x => x.n === n && x.nuovo); if (i >= 0) ALBERI.splice(i, 1);
  PER_N.delete(n); delete DB.alberi[n];
  DB.eventi = DB.eventi.filter(e => e.n !== n);
  if (albAperto === n) chiudiAlbero();
}
function eliminaNuovo(n) {
  const a = PER_N.get(n);
  if (!confirm(`Eliminare l'albero nuovo n. ${num(a)} (${nomeSp(a)})?\nVengono cancellati anche il suo storico e le correzioni. Non si può annullare.`)) return;
  rimuoviNuovo(n);
  CLOUD.elimina("eventi", { n }); CLOUD.elimina("alberi_mod", { n }); CLOUD.elimina("nuovi_alberi", { n });
  toast("Albero eliminato"); aggiorna();
}

/* ---------- Aggiornamenti dall'altro dispositivo ---------- */
let rinvio = null;
function ridisegnaPresto() {
  clearTimeout(rinvio);
  rinvio = setTimeout(() => {
    const occupato = document.querySelector("dialog[open]") || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
    if (occupato) { ridisegnaPresto(); return; }
    aggiorna();
    if (albAperto) apriAlbero(albAperto);
  }, 400);
}
window.applicaRemoto = (tab, riga, tipo) => {
  if (!riga) return;
  if (tab === "pratiche") { if (tipo === "DELETE") delete DB.pratiche[riga.id]; else DB.pratiche[riga.id] = riga.dati; ridisegnaPresto(); return; }
  if (tab === "bilanci") { DB.bilanci = DB.bilanci || {}; if (tipo === "DELETE") delete DB.bilanci[riga.id]; else DB.bilanci[riga.id] = riga.dati; ridisegnaPresto(); return; }
  if (tipo === "DELETE") {
    if (tab === "eventi") DB.eventi = DB.eventi.filter(e => e.id !== riga.id);
    else if (tab === "alberi_mod") { delete DB.alberi[riga.n]; applicaCampi(riga.n); }
    else if (tab === "ordini") delete DB.ordini[riga.id];
    else if (tab === "nuovi_alberi" && PER_N.has(riga.n)) rimuoviNuovo(riga.n);
    ridisegnaPresto(); return;
  }
  if (tab === "eventi") { const v = Object.assign({}, riga.dati, { id: riga.id }); const i = DB.eventi.findIndex(e => e.id === riga.id); if (i >= 0) DB.eventi[i] = v; else DB.eventi.push(v); }
  else if (tab === "alberi_mod") { DB.alberi[riga.n] = riga.dati; applicaCampi(riga.n); }
  else if (tab === "ordini") DB.ordini[riga.id] = riga.dati;
  else if (tab === "impostazioni" && riga.id === "globali") { DB.impostazioni = Object.assign(DB.impostazioni, riga.dati); DB.impostazioni.nomi = DB.impostazioni.nomi || {}; }
  else if (tab === "nuovi_alberi") {
    if (!PER_N.has(riga.n)) { DB.nuoviAlberi.push(riga.dati); aggiungiNuovo(riga.dati); }
    else { const r = DB.nuoviAlberi.find(x => x.n === riga.n); if (r) Object.assign(r, riga.dati); const a = PER_N.get(riga.n); Object.assign(a, riga.dati, { s: indiceSpecie(riga.dati.com || "", riga.dati.bot || ""), a: indiceArea(riga.dati.areaNome || "Area non indicata") }); }
  }
  ridisegnaPresto();
};

/* ---------- Avvio ---------- */
Object.keys(DB.alberi).forEach(k => applicaCampi(+k));
statoSalvataggio();
aggiornaContatori();
vai(innerWidth <= 900 ? "campo" : "oggi");
};
</script>
</body>
